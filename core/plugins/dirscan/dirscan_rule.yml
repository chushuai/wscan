version: "1"
category:
  - name: dirscan/code/svn
    title: svn
  - name: dirscan/backup/default
    title: backup_files
  - name: dirscan/service/probe
    title: server_probe
  - name: dirscan/backup/php
    title: phpinfo
  - name: dirscan/temp/swp
    title: swp_info
  - name: dirscan/backup/bash
    title: bash_history
  - name: dirscan/backup/jsp
    title: jsp_samples
  - name: dirscan/default/cgi
    title: cgi_documents
  - name: dirscan/sample/test
    title: test_samples
  - name: dirscan/test/dreamware
    title: mdrds
  - name: dirscan/sensitive/statistic
    title: statics_info
  - name: dirscan/default/dir
    title: default_diretory
  - name: dirscan/sensitive/dir
    title: sensitive_documents
  - name: dirscan/directory/logs
    title: log_info
  - name: dirscan/config/frontpage
    title: frontpage
  - name: dirscan/file/resion
    title: resion_doc
  - name: dirscan/sensitive/file
    title: sensitive_file
  - name: dirscan/editor/CKEditor
    title: ckedit_disclosure
  - name: dirscan/editor/eWebEditor
    title: ewebeditor_disclosure
  - name: dirscan/database/file
    title: database_disclosure
  - name: dirscan/sensitive/sitemap
    title: sitemap_disclosure
  - name: dirscan/sensitive/crossdomain
    title: crossdomain
  - name: config/ide
    title: ide_config
  - name: dirscan/default
    title: default
rules:
  # ====================================================================
  # SVN / Git / Mercurial / Bazaar version control exposure
  # ====================================================================
  - category: dirscan/code/svn
    paths:
      - .svn/entries
    suffix: []
    expression: response.status == 200 && "dir.*?svn://|dir.*?https://".bmatches(response.body)
    partial: false
    root: false
  - category: dirscan/code/svn
    paths:
      - CVS/Entries
    suffix: []
    expression: response.status == 200 && "\d \d{2}:\d{2}:\d{2} \d{4}//".bmatches(response.body)
    partial: false
    root: false
  - category: dirscan/code/svn
    paths:
      - .git/config
    suffix: []
    expression: response.status == 200 && "branch "master"".bmatches(response.body)
    partial: false
    root: false
  - category: dirscan/code/svn
    paths:
      - .git/HEAD
    suffix: []
    expression: 'response.status == 200 && "^ref: refs/".bmatches(response.body)'
    partial: false
    root: false
  - category: dirscan/code/svn
    paths:
      - .git/info/refs
    suffix: []
    expression: response.status == 200 && "^[a-f0-9]{40}\s+refs/".bmatches(response.body)
    partial: false
    root: false
  - category: dirscan/code/svn
    paths:
      - .git/objects/info/packs
    suffix: []
    expression: response.status == 200 && "^P pack-[a-f0-9]{40}\.pack".bmatches(response.body)
    partial: false
    root: false
  - category: dirscan/code/svn
    paths:
      - .git/packed-refs
    suffix: []
    expression: response.status == 200 && "^[a-f0-9]{40} refs/".bmatches(response.body)
    partial: false
    root: false
  - category: dirscan/code/svn
    paths:
      - .git/refs/heads/master
    suffix: []
    expression: response.status == 200 && "^[a-f0-9]{40}".bmatches(response.body)
    partial: false
    root: false
  - category: dirscan/code/svn
    paths:
      - .git/index
    suffix: []
    expression: response.status == 200 && response.content_length > 0 && response.content_length < 1048576 && !"<html".bmatches(response.body)
    partial: false
    root: false
  - category: dirscan/code/svn
    paths:
      - .hg/hgrc
    suffix: []
    expression: response.status == 200 && "\[\[paths\].*?default =".bmatches(response.body)
    partial: false
    root: false
  - category: dirscan/code/svn
    paths:
      - .hg/requires
    suffix: []
    expression: response.status == 200 && "^revlogv1".bmatches(response.body)
    partial: false
    root: false
  - category: dirscan/code/svn
    paths:
      - .bzr/README
    suffix: []
    expression: response.status == 200 && "^This\sis\sa\sBazaar".bmatches(response.body)
    partial: false
    root: false

  # ====================================================================
  # Backup files — archive formats with magic byte verification
  # ====================================================================
  - category: dirscan/backup/default
    paths:
      - wwwroot.rar
      - htdocs.rar
      - backup.rar
    suffix: []
    expression: response.status == 200 && "Rar!".bmatches(response.body)
    partial: false
    root: false
  - category: dirscan/backup/default
    paths:
      - backup.tar.gz
      - htdocs.tar.gz
    suffix: []
    expression: response.status == 200 && "\x1f\x8b".bmatches(response.body)
    partial: false
    root: false
  - category: dirscan/backup/default
    paths:
      - wwwroot.zip
      - htdocs.zip
      - backup.zip
      - index.zip
      - site.zip
    suffix: []
    expression: response.status == 200 && "PK\x03\x04".bmatches(response.body)
    partial: false
    root: false
  - category: dirscan/backup/default
    paths:
      - wwwroot.tar
      - htdocs.tar
      - backup.tar
    suffix: []
    expression: response.status == 200 && "ustar".bmatches(response.body)
    partial: false
    root: false
  - category: dirscan/backup/default
    paths:
      - wwwroot.7z
      - htdocs.7z
      - backup.7z
    suffix: []
    expression: response.status == 200 && "7z\xbc\xaf\x27\x1c".bmatches(response.body)
    partial: false
    root: false

  # Backup file extensions — require body content that looks like code/config
  - category: dirscan/backup/default
    paths:
      - index.bak
      - index.php.bak
      - index.html.bak
      - index.asp.bak
      - index.aspx.bak
      - index.jsp.bak
      - index.php~
      - index.html~
      - config.php.bak
      - config.php~
      - config.inc.php.bak
      - config.inc.php~
      - db.php.bak
      - db.php~
      - db.inc
      - database.yml
      - config/database.yml
    suffix: []
    expression: response.status == 200 && response.content_length > 20 && ("<\?php|<html|<\!DOCTYPE|<script|<asp:|<%@|<%|<jsp:|<c:|password|secret|database|host:|adapter:|encoding:|username|connection".bmatches(response.body))
    partial: false
    root: false
  - category: dirscan/backup/default
    paths:
      - .old
      - .bak
      - .bck
      - .copy
      - .temp
    suffix: []
    expression: response.status == 200 && response.content_length > 20 && ("<\?php|<html|<\!DOCTYPE|<script|<asp:|<%@|<%|<jsp:|password|secret|database|host:|import |package |class |def |function |var |const |include|require|namespace".bmatches(response.body))
    partial: false
    root: false

  # ====================================================================
  # Service probes — already have content matching (keep as-is)
  # ====================================================================
  - category: dirscan/service/probe
    paths:
      - iprober.php
      - index1.php
    suffix: []
    expression: response.status == 200 && "Prober.*?V\d\.\d{3}".bmatches(response.body)
    partial: false
    root: false
  - category: dirscan/service/probe
    paths:
      - i.php
    suffix: []
    expression: response.status == 200 && "<!--服务器相关参数-->.*?<!--组件信息-->.*?<!--数据库支持-->.*?<!--服务器性能检测-->".bmatches(response.body)
    partial: false
    root: false
  - category: dirscan/service/probe
    paths:
      - tz.php
    suffix: []
    expression: response.status == 200 && "<td id="f31">Powered by.*?<a href="http://www.depoch.net"><b>dEpoch
      Studio</b>".bmatches(response.body)
    partial: false
    root: false
  - category: dirscan/service/probe
    paths:
      - aspcheck.asp
    suffix: []
    expression: response.status == 200 && "<h2>ASP组件支持情况</h2><a name=".bmatches(response.body)
    partial: false
    root: false
  - category: dirscan/service/probe
    paths:
      - DotNetInfo.aspx
    suffix: []
    expression: response.status == 200 && "服务器COM组件安装检测</td>".bmatches(response.body)
    partial: false
    root: false
  - category: dirscan/service/probe
    paths:
      - jspcheck.aspx
    suffix: []
    expression: response.status == 200 && "<td colspan="2" class="TrHead">服务器COM组件安装检测</td>".bmatches(response.body)
    partial: false
    root: false

  # ====================================================================
  # PHP info pages — already have content matching
  # ====================================================================
  - category: dirscan/backup/php
    paths:
      - /?phpinfo=1
      - phpinfo.php
    suffix: []
    expression: response.status == 200 && "PHP Version.*?System.*?Build Date".bmatches(response.body)
    partial: false
    root: false
  - category: dirscan/backup/php
    paths:
      - test.php
      - 1.php
      - index1.php
      - t.php
      - p.php
      - php.php
      - info.php
      - s.php
      - x.php
    suffix: []
    expression: response.status == 200 && "PHPE9568F34-D428-11d2-A769-00AA001ACF42.*?PHPE9568F35-D428-11d2-A769-00AA001ACF42.*?PHPB8B5F2A0-3C92-11d3-A3A9-4C7B08C10000".bmatches(response.body)
    partial: false
    root: false

  # ====================================================================
  # Swap / vim temp files
  # ====================================================================
  - category: dirscan/temp/swp
    paths:
      - index.php.swp
      - .index.php.swp
      - .config.php.swp
      - .config.inc.php.swp
      - .settings.php.swp
      - .database.php.swp
      - .db.php.swp
      - .mysql.php.swp
      - config/.config.php.swp
    suffix: []
    expression: response.status == 200 && ("<\?php|<html|function |class |include|require|echo |print |namespace".bmatches(response.body))
    partial: false
    root: false
  - category: dirscan/temp/swp
    paths:
      - .bash_history
      - .zsh_history
    suffix: []
    expression: response.status == 200 && "ls.*?cd.*?|dir.*?cd|chmod|chown|mkdir|rm |cat |echo |export|grep |find |curl |wget ".bmatches(response.body)
    partial: false
    root: false
  - category: dirscan/temp/swp
    paths:
      - .bashrc
    suffix: []
    expression: response.status == 200 && ("alias |export |PATH=|source |bind |set |shopt|umask|# ~/.bashrc".bmatches(response.body))
    partial: false
    root: false

  # ====================================================================
  # JSP samples
  # ====================================================================
  - category: dirscan/backup/jsp
    paths:
      - examples/jsp/
    suffix: []
    expression: response.status == 200 && "<title>jsp samples</title>|<title>jsp examples</title>".bmatches(response.body)
    partial: false
    root: false

  # ====================================================================
  # CGI
  # ====================================================================
  - category: dirscan/default/cgi
    paths:
      - cgi-bin/
    suffix: []
    expression: (response.status == 200 || response.status == 403) && response.content_length > 0
    partial: false
    root: false

  # ====================================================================
  # Test/sample pages — require test-specific content in body
  # ====================================================================
  - category: dirscan/sample/test
    paths:
      - test
      - test0
      - test1
      - test/
    suffix: []
    expression: response.status == 200 && ("<title>test|<h1>test|test page|testing|debug|it works|hello world|server info|phpinfo|system info|server status".bmatches(response.body) || "<title>Index of".bmatches(response.body))
    partial: false
    root: false
  - category: dirscan/sample/test
    paths:
      - test.php
    suffix: []
    expression: response.status == 200 && ("<\?php|test page|phpinfo|it works|hello world|debug|php version".bmatches(response.body))
    partial: false
    root: false
  - category: dirscan/sample/test
    paths:
      - test.asp
    suffix: []
    expression: response.status == 200 && ("<%@|test page|it works|hello world|debug|asp test|server object|response.write".bmatches(response.body))
    partial: false
    root: false
  - category: dirscan/sample/test
    paths:
      - test.aspx
    suffix: []
    expression: response.status == 200 && ("<%@|test page|it works|hello world|debug|asp.net".bmatches(response.body))
    partial: false
    root: false
  - category: dirscan/sample/test
    paths:
      - test.cfm
    suffix: []
    expression: response.status == 200 && ("<cf|coldfusion|test page|it works|hello world|debug".bmatches(response.body))
    partial: false
    root: false
  - category: dirscan/sample/test
    paths:
      - test.cgi
    suffix: []
    expression: response.status == 200 && ("Content-type:|#!/|test page|it works|hello world|debug|cgi".bmatches(response.body))
    partial: false
    root: false
  - category: dirscan/sample/test
    paths:
      - test.chm
    suffix: []
    expression: response.status == 200 && "ITSF".bmatches(response.body)
    partial: false
    root: false
  - category: dirscan/sample/test
    paths:
      - test.htm
      - test.html
      - testing.htm
      - testing.html
    suffix: []
    expression: response.status == 200 && ("<html|<head|<body|test page|it works|hello world|debug|testing".bmatches(response.body))
    partial: false
    root: false
  - category: dirscan/sample/test
    paths:
      - test.jsp
      - testing.jsp
    suffix: []
    expression: response.status == 200 && ("<%@|<jsp:|test page|it works|hello world|debug|servlet".bmatches(response.body))
    partial: false
    root: false
  - category: dirscan/sample/test
    paths:
      - test.shtml
      - testing.shtml
    suffix: []
    expression: response.status == 200 && ("<!--#|<html|test page|it works|hello world|debug".bmatches(response.body))
    partial: false
    root: false
  - category: dirscan/sample/test
    paths:
      - test.txt
      - testing.txt
    suffix: []
    expression: response.status == 200 && ("test|debug|hello|it works|configuration|password|secret|admin|root|server".bmatches(response.body))
    partial: false
    root: false
  - category: dirscan/sample/test
    paths:
      - test_testing.asp
    suffix: []
    expression: response.status == 200 && ("<%@|test|it works|hello world|debug|response.write".bmatches(response.body))
    partial: false
    root: false
  - category: dirscan/sample/test
    paths:
      - testing.cfm
    suffix: []
    expression: response.status == 200 && ("<cf|coldfusion|test|it works|hello world|debug".bmatches(response.body))
    partial: false
    root: false
  - category: dirscan/sample/test
    paths:
      - testing.cgi
    suffix: []
    expression: response.status == 200 && ("Content-type:|#!/|test|it works|hello world|debug".bmatches(response.body))
    partial: false
    root: false
  - category: dirscan/sample/test
    paths:
      - testing.php
    suffix: []
    expression: response.status == 200 && ("<\?php|test|it works|hello world|debug|phpinfo".bmatches(response.body))
    partial: false
    root: false

  # ====================================================================
  # Dreamware
  # ====================================================================
  - category: dirscan/test/dreamware
    paths:
      - _mmServerScripts/
      - _mmDBScripts/
    suffix: []
    expression: response.status == 200 && ("mmhttpdb|MMHTTPDB|Dreamweaver|adovbs.inc|MM_query".bmatches(response.body) || "<title>Index of".bmatches(response.body))
    partial: false
    root: false

  # ====================================================================
  # Statistics
  # ====================================================================
  - category: dirscan/sensitive/statistic
    paths:
      - usage/
    suffix: []
    expression: (response.status == 200 || response.status == 401) && "Usage Statistics".bmatches(response.body)
    partial: false
    root: false

  # ====================================================================
  # Default directories — require directory listing or specific content
  # ====================================================================
  - category: dirscan/default/dir
    paths:
      - include/
      - lib/
    suffix: []
    expression: (response.status == 200 || response.status == 401) && ("<title>Index of|<h1>Index of|Parent Directory|.php|.asp|.jsp|.html".bmatches(response.body))
    partial: false
    root: false

  # ====================================================================
  # Sensitive directories — require directory listing or app-specific content
  # ====================================================================
  - category: dirscan/sensitive/dir
    paths:
      - secured/
      - error/
      - private/
      - stats/
      - temp/
      - class/
      - files/
      - inc/
      - img/
    suffix: []
    expression: (response.status == 200 || response.status == 401) && ("<title>Index of|<h1>Index of|Parent Directory".bmatches(response.body))
    partial: false
    root: false
  - category: dirscan/sensitive/dir
    paths:
      - db/
      - SQL/
      - DB/
    suffix: []
    expression: (response.status == 200 || response.status == 401) && ("<title>Index of|<h1>Index of|Parent Directory|.sql|.mdb|.db|.sqlite".bmatches(response.body))
    partial: false
    root: false
  - category: dirscan/sensitive/dir
    paths:
      - backup/
      - backups/
      - bak/
    suffix: []
    expression: (response.status == 200 || response.status == 401) && ("<title>Index of|<h1>Index of|Parent Directory|.rar|.zip|.tar|.gz|.bak|.sql|.sql".bmatches(response.body))
    partial: false
    root: false
  - category: dirscan/sensitive/dir
    paths:
      - server-status/
    suffix: []
    expression: response.status == 200 && "Server Status|Apache Server Status|Server Version|Current Time|Restart Time|Parent Server Generation|Server uptime".bmatches(response.body)
    partial: false
    root: false
  - category: dirscan/sensitive/dir
    paths:
      - server-status
    suffix: []
    expression: response.status == 200 && "Server Status|Apache Server Status|Server Version|Current Time|Restart Time|Parent Server Generation|Server uptime".bmatches(response.body)
    partial: false
    root: false
  - category: dirscan/sensitive/dir
    paths:
      - WEB-INF/
    suffix: []
    expression: response.status == 200 && ("<title>Index of|<h1>Index of|Parent Directory|web.xml|classes/|lib/".bmatches(response.body))
    partial: false
    root: false
  - category: dirscan/sensitive/dir
    paths:
      - CVS/
      - .idea/
    suffix: []
    expression: response.status == 200 && "<head><title>Index of [\w\W]+</title></head>[\S\s]*?<body
      bgcolor="white">[\S\s]*?<h1>Index of [\w\W]+</h1><hr><pre><a href="\.\./">\.\./</a>".bmatches(response.body)
    partial: false
    root: false
  - category: dirscan/sensitive/dir
    paths:
      - CMS/
    suffix: []
    expression: response.status == 200 && ("<title>Index of|<h1>Index of|Parent Directory|cms|wordpress|joomla|drupal".bmatches(response.body))
    partial: false
    root: false
  - category: dirscan/sensitive/dir
    paths:
      - '!install/'
    suffix: []
    expression: response.status == 200 && ("install|setup|wizard|configuration|database|step".bmatches(response.body))
    partial: false
    root: false
  - category: dirscan/sensitive/dir
    paths:
      - jdbc/
    suffix: []
    expression: response.status == 200 && ("jdbc|driver|connection|database|oracle|mysql|postgres".bmatches(response.body))
    partial: false
    root: false
  - category: dirscan/sensitive/dir
    paths:
      - ~root/
      - ~log/
      - ~admin/
    suffix: []
    expression: response.status == 200 && ("<title>Index of|<h1>Index of|Parent Directory".bmatches(response.body))
    partial: false
    root: false
  - category: dirscan/sensitive/dir
    paths:
      - src/
      - source/
    suffix: []
    expression: response.status == 200 && ("<title>Index of|<h1>Index of|Parent Directory|.java|.py|.php|.js|.ts|.go|.rb".bmatches(response.body))
    partial: false
    root: false

  # ====================================================================
  # Log files
  # ====================================================================
  - category: dirscan/directory/logs
    paths:
      - access.log
    suffix: []
    expression: response.status == 200 && "GET.*?HTTP/1.[01]".bmatches(response.body)
    partial: false
    root: false
  - category: dirscan/directory/logs
    paths:
      - error.log
    suffix: []
    expression: response.status == 200 && ("error|warn|fail|exception|traceback|stack|notice".bmatches(response.body))
    partial: false
    root: false
  - category: dirscan/directory/logs
    paths:
      - errors.log
      - error_log
      - logs/access.log
      - 'logs/error.log'
      - 'logs/error_log'
    suffix: []
    expression: response.status == 200 && "GET.*?HTTP/1.[01].\d{3}".bmatches(response.body)
    partial: false
    root: false
  - category: dirscan/directory/logs
    paths:
      - logs/
    suffix: []
    expression: response.status == 200 && ("<title>Index of|<h1>Index of|Parent Directory|.log".bmatches(response.body))
    partial: false
    root: false

  # ====================================================================
  # FrontPage
  # ====================================================================
  - category: dirscan/config/frontpage
    paths:
      - postinfo.html
    suffix: []
    expression: response.status == 200 && "<!--\s*?postinfo.html version \d\.\d\d\d.*>".bmatches(response.body)
    partial: false
    root: false

  # ====================================================================
  # Resin
  # ====================================================================
  - category: dirscan/file/resion
    paths:
      - resin-doc/viewfile/?contextpath=../../../../&file=WEB-INF/web.xml
    suffix: []
    expression: response.status == 200 && "<title>WEB-INF/web.xml</title>".bmatches(response.body)
    partial: false
    root: false

  # ====================================================================
  # Sensitive files — generic PHP/ASP/JSP test files (require code content)
  # ====================================================================
  - category: dirscan/sensitive/file
    paths:
      - 1.php
      - a.php
      - abc.php
      - 2.php
      - 3.php
      - dama.php
      - ooxx.php
      - x.php
    suffix: []
    expression: response.status == 200 && ("<\?php|phpinfo|eval|system|exec|passthru|shell_exec|base64_decode|assert|preg_replace|str_rot13|call_user_func".bmatches(response.body))
    partial: false
    root: false
  - category: dirscan/sensitive/file
    paths:
      - 1.asp
      - a.asp
      - abc.asp
      - 2.asp
      - 3.asp
      - 123.asp
      - dama.asp
      - ooxx.asp
      - x.asp
    suffix: []
    expression: response.status == 200 && ("<%@|<%|execute|eval|response.write|server.createobject|shell|wscript|command".bmatches(response.body))
    partial: false
    root: false
  - category: dirscan/sensitive/file
    paths:
      - 1.aspx
      - a.aspx
      - abc.aspx
      - 2.aspx
      - 3.aspx
      - 123.aspx
      - dama.aspx
      - ooxx.aspx
      - x.aspx
    suffix: []
    expression: response.status == 200 && ("<%@|<asp:|CodeFile|Inherits|runat=\"server\"|eval|execute|system.diagnostics|process.start".bmatches(response.body))
    partial: false
    root: false
  - category: dirscan/sensitive/file
    paths:
      - 1.jsp
      - a.jsp
      - abc.jsp
      - 2.jsp
      - 3.jsp
      - 123.jsp
      - dama.jsp
      - ooxx.jsp
      - x.jsp
      - s.jsp
    suffix: []
    expression: response.status == 200 && ("<%@|<jsp:|Runtime.getRuntime|ProcessBuilder|exec\\(|scriptlet|out.print|request.getParameter|response.sendRedirect".bmatches(response.body))
    partial: false
    root: false
  - category: dirscan/sensitive/file
    paths:
      - 1.jspx
      - test.jspx
      - dama.jspx
      - ooxx.jspx
      - x.jspx
      - s.jspx
      - shell.jspx
      - webshell.jspx
    suffix: []
    expression: response.status == 200 && ("<%@|<jsp:|Runtime.getRuntime|ProcessBuilder|exec\\(|scriptlet|jspx".bmatches(response.body))
    partial: false
    root: false
  - category: dirscan/sensitive/file
    paths:
      - ServerVariables.asp
    suffix: []
    expression: response.status == 200 && ("Request.ServerVariables|ALL_HTTP|APPL_MD_PATH|SERVER_NAME|SERVER_SOFTWARE|REMOTE_ADDR".bmatches(response.body))
    partial: false
    root: false
  - category: dirscan/sensitive/file
    paths:
      - WEB-INF/web.xml
